name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and bundle
    runs-on: ubuntu-latest
    # The same Ubuntu release (and GJS/GNOME versions) NetPulse targets.
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git gjs gir1.2-nm-1.0 libglib2.0-bin zip

      - uses: actions/checkout@v7

      - name: Validate the settings schema
        run: glib-compile-schemas --strict --dry-run schemas

      - name: Unit tests
        run: gjs -m tests/run.js

      - name: Build the extension bundle
        run: tools/build.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: extension-bundle
          path: dist/*.shell-extension.zip

  shell:
    name: GNOME Shell integration tests
    # A full Ubuntu 26.04 VM (systemd, logind, system bus) like a desktop;
    # GNOME Shell 50 runs headless inside the tests.
    runs-on: ubuntu-26.04
    steps:
      - name: Install GNOME Shell and test tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gnome-shell gnome-shell-common dconf-service dconf-gsettings-backend \
            at-spi2-core gir1.2-atspi-2.0 python3-gi libgl1-mesa-dri iproute2 zip
          # The network switching tests use unprivileged network namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - uses: actions/checkout@v7

      - name: Installer tests
        run: tests/install/test-install.sh

      - name: Headless GNOME Shell scenarios
        run: tools/ci-report.sh tools/test-headless.sh

      - name: Network switching scenarios
        run: NETPULSE_NETNS=1 NETPULSE_TEST_OUTPUT=test-output/netns tools/ci-report.sh tools/test-headless.sh

      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shell-test-output
          path: test-output/
          if-no-files-found: ignore
