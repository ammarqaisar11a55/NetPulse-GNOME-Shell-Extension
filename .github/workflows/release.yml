name: Release

# Publishes a GitHub release when a version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build the release bundle
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git gjs gir1.2-nm-1.0 libglib2.0-bin zip

      - uses: actions/checkout@v7

      - name: Check that the tag matches metadata.json
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/.*"version-name": *"\([^"]*\)".*/\1/p' metadata.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version-name $version in metadata.json"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Validate and test
        run: |
          glib-compile-schemas --strict --dry-run schemas
          gjs -m tests/run.js

      - name: Build the bundle
        run: |
          tools/build.sh dist
          (cd dist && sha256sum *.shell-extension.zip >SHA256SUMS)

      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md >dist/release-notes.md
          if ! grep -q '[^[:space:]]' dist/release-notes.md; then
            echo "::error::CHANGELOG.md has no entry for ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.shell-extension.zip dist/SHA256SUMS \
            --verify-tag \
            --title "NetPulse ${{ needs.build.outputs.version }}" \
            --notes-file dist/release-notes.md
